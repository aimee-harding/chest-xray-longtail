# Config 4: Robust Asymmetric Loss (RAL), Linear Probe
experiment:
  name: "config4_ral_linear_probe"
  description: "Configuration 4: RAL linear probe — evaluates Stage 1 representation quality"
  stage: "linear_probe"
  stage1_checkpoint: "/home-mscluster/aharding/chest_xray_longtail/outputs/config4_ral_stage1/checkpoint_best.pt"

data:
  data_dir: "/datasets/aharding/chest_xray14"
  num_workers: 8
  val_frac: 0.1
  seed: 42

model:
  backbone: "densenet121"
  num_classes: 14
  pretrained: false
  stage1_checkpoint: "/home-mscluster/aharding/chest_xray_longtail/outputs/config4_ral_stage1/checkpoint_best.pt"
  freeze_backbone: true

training:
  epochs: 20
  batch_size: 64
  sampling: "instance_balanced"

  optimizer:
    type: "adam"
    lr: 0.001
    weight_decay: 0.0

  scheduler:
    type: "plateau"
    patience: 5
    factor: 0.1
    min_lr: 0.000001

  loss:
    type: "bce"
    use_pos_weight: false

  early_stopping:
    patience: 10
    monitor: "val_auc_macro"

output:
  save_dir: "/home-mscluster/aharding/chest_xray_longtail/outputs/config4_ral_linear_probe"
  save_best: true
