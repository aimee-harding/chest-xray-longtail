# Config 4: Robust Asymmetric Loss (RAL), Stage 1
experiment:
  name: "config4_ral_stage1"
  description: "Configuration 4: Robust Asymmetric Loss (Park et al. 2023), stage 1"
  stage: "stage1"

data:
  data_dir: "/datasets/aharding/chest_xray14"
  num_workers: 8
  val_frac: 0.1
  seed: 42

model:
  backbone: "densenet121"
  num_classes: 14
  pretrained: true

training:
  epochs: 60
  batch_size: 64
  sampling: "instance_balanced"

  optimizer:
    type: "adam"
    lr: 0.0001
    weight_decay: 0.0001

  scheduler:
    type: "plateau"
    patience: 5
    factor: 0.1
    min_lr: 0.000001

  loss:
    type: "ral"
    gamma_neg: 4.0
    gamma_pos: 0.0
    clip: 0.05
    lamb: 1.5
    epsilon_pos: 1.0
    epsilon_pos_pow: -2.5
    epsilon_neg: 0.0

  early_stopping:
    patience: 10
    monitor: "val_auc_macro"

output:
  save_dir: "/home-mscluster/aharding/chest_xray_longtail/outputs/config4_ral_stage1"
  save_best: true
