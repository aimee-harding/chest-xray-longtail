# Config 5: simplified MSC (no queue), Stage 2
experiment:
  name: "config5_msc_stage2"
  description: "Configuration 5: MSC stage 2 — frozen backbone, class-aware sampling"
  stage: "stage2"
  stage1_checkpoint: "/home-mscluster/aharding/chest_xray_longtail/outputs/config5_msc_stage1/checkpoint_best.pt"

data:
  data_dir: "/datasets/aharding/chest_xray14"
  num_workers: 8
  val_frac: 0.1
  seed: 42

model:
  backbone: "densenet121"
  num_classes: 14
  pretrained: false
  stage1_checkpoint: "/home-mscluster/aharding/chest_xray_longtail/outputs/config5_msc_stage1/checkpoint_best.pt"
  freeze_backbone: true

training:
  epochs: 30
  batch_size: 64
  sampling: "class_aware"

  optimizer:
    type: "adam"
    lr: 0.0001
    weight_decay: 0.0001

  scheduler:
    type: "plateau"
    patience: 5
    factor: 0.1
    min_lr: 0.000001

  loss:
    type: "bce"
    use_pos_weight: false

  early_stopping:
    patience: 10
    monitor: "val_auc_macro"

output:
  save_dir: "/home-mscluster/aharding/chest_xray_longtail/outputs/config5_msc_stage2"
  save_best: true
