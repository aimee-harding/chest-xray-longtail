# config 2: Decoupled BCE Baseline (Stage 1)

experiment:
  name: "stage1_bce"
  description: "Decoupled Stage 1 — plain BCE backbone"
  stage: "stage1"

data:
  data_dir: "/datasets/aharding/chest_xray14"
  num_workers: 8
  val_frac: 0.1
  seed: 42

model:
  backbone: "densenet121"
  num_classes: 14
  pretrained: true

training:
  epochs: 50
  batch_size: 64
  sampling: "instance_balanced"

  optimizer:
    type: "adam"
    lr: 0.0001
    weight_decay: 0.0001

  scheduler:
    type: "plateau"
    patience: 5
    factor: 0.1
    min_lr: 0.000001

  loss:
    type: "bce"
    use_pos_weight: false

  early_stopping:
    patience: 10
    monitor: "val_auc_macro"

output:
  save_dir: "/home-mscluster/aharding/chest_xray_longtail/outputs/stage1_bce"
  save_best: true
