# Configuration 1: Joint Training BCE Baseline (Lower Bound)
# ─────────────────────────────────────────────────────────────
# Standard DenseNet-121 trained end-to-end with BCE.
# No decoupling, no long-tail mechanisms.
# This is the conventional approach and serves as the absolute lower bound.

experiment:
  name: "joint_bce_baseline"
  description: "Joint training with BCE — lower bound baseline"
  stage: "joint" # 'joint' | 'stage1' | 'stage2'

data:
  data_dir: "/datasets/aharding/chest_xray14"
  num_workers: 8
  val_frac: 0.1
  seed: 42

model:
  backbone: "densenet121"
  num_classes: 14
  pretrained: true

training:
  # Joint training — no decoupling
  epochs: 50
  batch_size: 64
  sampling: "instance_balanced" # standard random sampling

  optimizer:
    type: "adam"
    lr: 0.0001
    weight_decay: 0.0001

  scheduler:
    type: "plateau" # reduce LR on val AUC plateau
    patience: 5
    factor: 0.1
    min_lr: 0.000001

  loss:
    type: "bce"
    use_pos_weight: false # no class weighting in joint baseline

  early_stopping:
    patience: 10
    monitor: "val_auc_macro"

output:
  save_dir: "/home-mscluster/aharding/chest_xray_longtail/outputs/joint_bce_baseline"
  save_best: true # save checkpoint with best val macro AUC
